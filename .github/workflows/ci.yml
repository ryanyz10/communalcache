name: CI

on:
  pull_request:
  push:
    branches: [master, production]
  workflow_call:

permissions:
  contents: read

env:
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install locked dependencies
        run: npm ci && npm --prefix web ci
      - name: Typecheck Worker and Durable Objects
        run: npx --no-install tsc --noEmit
      - name: Typecheck web
        run: cd web && npx --no-install tsc --noEmit
      - name: Test local runtime and UI
        run: npx --no-install vitest run
      - name: Build web assets
        run: npm --prefix web run build
      - name: Check default Worker bundle
        run: npx --no-install wrangler deploy --dry-run
      - name: Check staging Worker bundle
        run: npx --no-install wrangler deploy --dry-run -e staging
      - name: Check production Worker bundle
        run: npx --no-install wrangler deploy --dry-run -e production
