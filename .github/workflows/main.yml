name: Staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

env:
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
  WRANGLER_SEND_METRICS: 'false'
  CLOUDFLARE_ACCOUNT_ID: be6051e1d082f9e206faca4c784d43e5

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://communalcache-staging.ryanyz10-be6.workers.dev
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Check out the successful CI revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install locked dependencies
        run: npm ci && npm --prefix web ci
      - name: Build web assets
        run: npm --prefix web run build
      - name: Migrate and deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Completion order is not commit order; never redeploy an obsolete master run.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [ "$latest" != "$DEPLOY_SHA" ]; then
            echo 'Skipping a superseded master revision.'
            exit 0
          fi
          npx --no-install wrangler d1 migrations apply communalcache-staging --remote -e staging
          npx --no-install wrangler deploy -e staging
