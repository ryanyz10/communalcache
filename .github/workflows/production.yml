name: Production

on:
  push:
    branches: [production]

permissions:
  contents: read

env:
  CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
  WRANGLER_SEND_METRICS: 'false'
  CLOUDFLARE_ACCOUNT_ID: be6051e1d082f9e206faca4c784d43e5

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://communalcache.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out the promoted revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install locked dependencies
        run: npm ci && npm --prefix web ci
      - name: Build web assets
        run: npm --prefix web run build
      - name: Migrate and deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          # CI completion or reviewer waits can reorder promotions; keep the latest head.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/production" --jq '.object.sha')
          if [ "$latest" != "$DEPLOY_SHA" ]; then
            echo 'Skipping a superseded production revision.'
            exit 0
          fi
          npx --no-install wrangler d1 migrations apply communalcache --remote -e production
          npx --no-install wrangler deploy -e production
